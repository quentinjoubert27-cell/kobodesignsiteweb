<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Configs — Kobo Design</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root{--accent:#CD3E00;--bg:#FFFAF0;--dark:#1A1A1A;--font:'Poppins',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--dark);min-height:100vh}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;
      padding:0 clamp(20px,5vw,72px);border-bottom:1px solid rgba(26,26,26,.08);
      background:rgba(255,250,240,.96);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
    .logo img{height:30px}
    .badge{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
      color:var(--accent);background:rgba(205,62,0,.08);border:1px solid rgba(205,62,0,.2);
      border-radius:100px;padding:6px 14px}
    .page{max-width:1100px;margin:0 auto;padding:40px clamp(20px,5vw,72px) 80px}
    .eyebrow{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
    h1{font-size:clamp(24px,3vw,40px);font-weight:900;letter-spacing:-.03em;margin-bottom:6px}
    h1 em{font-style:italic;font-weight:300;color:rgba(26,26,26,.28)}
    .sub{font-size:12px;color:rgba(26,26,26,.45);margin-bottom:36px}

    /* Auth */
    #authWrap{max-width:380px;margin:60px auto 0;background:#fff;border-radius:18px;
      border:1px solid rgba(26,26,26,.09);padding:40px;text-align:center}
    #authWrap h2{font-size:18px;font-weight:700;margin-bottom:20px}
    .field{width:100%;padding:11px 14px;font-family:var(--font);font-size:13px;
      border:1.5px solid rgba(26,26,26,.15);border-radius:8px;outline:none;
      transition:border-color .2s;margin-bottom:12px}
    .field:focus{border-color:var(--accent)}
    .btn{width:100%;padding:13px;font-family:var(--font);font-size:10px;font-weight:700;
      letter-spacing:.18em;text-transform:uppercase;background:var(--dark);color:#fff;
      border:none;border-radius:10px;cursor:pointer;transition:background .2s}
    .btn:hover{background:#2d2d2d}
    .auth-err{font-size:11px;color:#c00;margin-top:8px}

    /* Stats */
    .stats{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap}
    .stat{background:#fff;border-radius:12px;border:1px solid rgba(26,26,26,.08);
      padding:16px 24px;flex:1;min-width:130px}
    .stat-val{font-size:28px;font-weight:900;color:var(--accent)}
    .stat-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(26,26,26,.4);margin-top:2px}

    /* Table */
    .configs-wrap{background:#fff;border-radius:18px;border:1px solid rgba(26,26,26,.09);overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead tr{background:rgba(26,26,26,.03)}
    th{padding:12px 16px;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      color:rgba(26,26,26,.4);text-align:left;border-bottom:1px solid rgba(26,26,26,.07)}
    td{padding:14px 16px;font-size:12px;border-bottom:1px solid rgba(26,26,26,.05);vertical-align:top}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(205,62,0,.025)}
    .cfg-date{font-size:10px;color:rgba(26,26,26,.4);white-space:nowrap}
    .cfg-name{font-weight:700}
    .cfg-email{font-size:11px;color:rgba(26,26,26,.5)}
    .cfg-dims{font-weight:700;white-space:nowrap}
    .cfg-mat{font-size:11px;color:rgba(26,26,26,.5)}
    .cfg-elems{font-size:11px;color:rgba(26,26,26,.55);line-height:1.6}
    .cfg-msg{font-size:11px;color:rgba(26,26,26,.55);font-style:italic;max-width:200px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .viz-btn{display:inline-block;padding:7px 14px;background:var(--accent);color:#fff;
      font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;border-radius:100px;text-decoration:none;white-space:nowrap;
      transition:background .15s}
    .viz-btn:hover{background:#b03500}
    .empty{padding:60px;text-align:center;color:rgba(26,26,26,.35);font-size:13px}

    /* Loading */
    .loading{text-align:center;padding:60px;color:rgba(26,26,26,.35);font-size:13px}
    .spinner{display:inline-block;width:24px;height:24px;border:3px solid rgba(205,62,0,.15);
      border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
      margin-bottom:12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Fiche technique accordéon */
    .fiche-btn{
      display:inline-flex;align-items:center;gap:5px;padding:7px 12px;
      font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:.1em;
      text-transform:uppercase;border:1.5px solid rgba(26,26,26,.18);
      border-radius:100px;background:none;color:rgba(26,26,26,.5);cursor:pointer;
      transition:border-color .2s,color .2s,background .2s;white-space:nowrap;
    }
    .fiche-btn:hover,.fiche-btn.open{border-color:var(--accent);color:var(--accent)}
    .fiche-btn.open{background:rgba(205,62,0,.06)}
    .fiche-row td{padding:0 !important;border-bottom:1px solid rgba(26,26,26,.07)!important}
    .fiche-inner{
      padding:20px 24px;background:rgba(255,250,240,.5);
      display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;
    }
    .fiche-sect{}
    .fiche-sect-title{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      color:rgba(26,26,26,.38);margin-bottom:8px}
    .fiche-block{background:#fff;border-radius:8px;border:1px solid rgba(26,26,26,.07);
      padding:8px 12px}
    .fiche-drow{display:flex;justify-content:space-between;align-items:baseline;
      font-size:11px;padding:2px 0;gap:8px}
    .fiche-drow span{color:rgba(26,26,26,.5);flex:1}
    .fiche-drow strong{color:var(--dark);font-weight:700;white-space:nowrap;font-size:11.5px}
    .fiche-empty{font-size:11px;color:rgba(26,26,26,.3);font-style:italic}
    .fiche-actions{display:flex;gap:8px;align-items:center;margin-top:12px;grid-column:1/-1}
    .fiche-copy-btn{
      padding:8px 16px;font-family:var(--font);font-size:9px;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase;border:1.5px solid rgba(26,26,26,.18);
      border-radius:8px;cursor:pointer;background:#fff;color:rgba(26,26,26,.5);
      transition:border-color .2s,color .2s;
    }
    .fiche-copy-btn:hover{border-color:var(--accent);color:var(--accent)}
    .fiche-copy-btn.ok{border-color:#22a35a;color:#22a35a}
    .fiche-surface{font-size:11px;color:rgba(26,26,26,.45);padding:8px 12px;
      background:rgba(26,26,26,.03);border-radius:8px;line-height:1.7}
    .fiche-surface strong{color:var(--dark)}

    /* ── CRM ──────────────────────────────────────── */
    .pipeline-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .pipe-card{flex:1;min-width:88px;background:#fff;border-radius:10px;
      border:2px solid rgba(26,26,26,.06);padding:10px 14px;
      display:flex;align-items:center;gap:10px;cursor:pointer;
      transition:border-color .15s,background .15s}
    .pipe-card:hover{border-color:rgba(26,26,26,.2)}
    .pipe-card.active{border-color:var(--accent);background:rgba(205,62,0,.04)}
    .pipe-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .pipe-count{font-size:20px;font-weight:900;color:var(--dark);line-height:1}
    .pipe-lbl{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
      color:rgba(26,26,26,.38);margin-top:2px}
    .crm-toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
    .crm-search{flex:1;min-width:200px;padding:10px 14px;font-family:var(--font);font-size:12px;
      border:1.5px solid rgba(26,26,26,.12);border-radius:10px;outline:none;
      background:#fff;transition:border-color .2s;color:var(--dark)}
    .crm-search:focus{border-color:var(--accent)}
    .crm-search::placeholder{color:rgba(26,26,26,.35)}
    .status-sel{padding:5px 8px;font-family:var(--font);font-size:9px;font-weight:700;
      letter-spacing:.06em;text-transform:uppercase;border-radius:100px;border:none;
      cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;white-space:nowrap}
    .s-nouveau{background:rgba(205,62,0,.12);color:#CD3E00}
    .s-contact{background:rgba(37,99,235,.1);color:#2563EB}
    .s-devis{background:rgba(124,58,237,.1);color:#7C3AED}
    .s-gagne{background:rgba(34,163,90,.12);color:#1a8a4a}
    .s-perdu{background:rgba(26,26,26,.07);color:rgba(26,26,26,.4)}
    .crm-notes-wrap{grid-column:1/-1;padding-top:4px}
    .crm-notes-lbl{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      color:rgba(26,26,26,.38);margin-bottom:6px}
    .crm-notes-ta{width:100%;padding:10px 12px;font-family:var(--font);font-size:11px;
      border:1.5px solid rgba(26,26,26,.1);border-radius:8px;outline:none;resize:vertical;
      background:#fff;color:var(--dark);min-height:60px;transition:border-color .2s;line-height:1.5}
    .crm-notes-ta:focus{border-color:var(--accent)}
    .crm-notes-hint{font-size:9px;color:rgba(26,26,26,.3);margin-top:4px;min-height:14px}
    .cfg-hidden{display:none!important}

    /* Type filters */
    .type-filters{display:flex;gap:6px;flex-wrap:wrap}
    .tf-btn{padding:7px 16px;border-radius:100px;border:1.5px solid rgba(26,26,26,.12);
      background:#fff;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:rgba(26,26,26,.45);cursor:pointer;transition:all .18s;white-space:nowrap}
    .tf-btn:hover{border-color:rgba(26,26,26,.3);color:var(--dark)}
    .tf-btn.active{border-color:var(--accent);background:var(--accent);color:#fff}
    .type-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:9px;
      font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;margin-left:4px}
    .tb-biblio{background:rgba(34,163,90,.1);color:#1a8a4a}
    .tb-sdb{background:rgba(37,99,235,.1);color:#2563EB}
    .tb-tv{background:rgba(205,62,0,.1);color:#CD3E00}
    .tb-dressing{background:rgba(180,83,9,.1);color:#b45309}
    .tb-mobilier{background:rgba(124,58,237,.1);color:#7C3AED}
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><img src="img/logo-kobo.png" alt="Kobo Design"/></a>
  <span class="badge">Admin · Configs</span>
</header>

<div class="page">
  <p class="eyebrow">Kobo Design</p>
  <h1>Configurations <em>reçues.</em></h1>
  <p class="sub">Toutes les configurations soumises par les visiteurs.</p>

  <!-- Auth -->
  <div id="authWrap">
    <h2>Accès sécurisé</h2>
    <input type="password" id="tokenInput" class="field" placeholder="Token d'accès" onkeydown="if(event.key==='Enter')auth()"/>
    <button class="btn" onclick="auth()">Accéder →</button>
    <p class="auth-err" id="authErr"></p>
  </div>

  <!-- Contenu (caché jusqu'à auth) -->
  <div id="content" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="pipeline-row" id="pipeline"></div>
    <div class="crm-toolbar">
      <input type="search" id="search-all" class="crm-search" placeholder="Rechercher par nom ou email…"/>
      <div class="type-filters" id="type-filters"></div>
    </div>
    <div class="configs-wrap" id="configsWrap">
      <div class="loading"><div class="spinner"></div><br>Chargement…</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  CRM — PIPELINE / STATUS / NOTES (localStorage)
// ═══════════════════════════════════════════════
var STATUS_LIST = [
  {id:'nouveau', label:'Nouveau',    color:'#CD3E00'},
  {id:'contact', label:'Contacté',   color:'#2563EB'},
  {id:'devis',   label:'Devis envoyé', color:'#7C3AED'},
  {id:'gagne',   label:'Gagné',      color:'#1a8a4a'},
  {id:'perdu',   label:'Non retenu', color:'rgba(26,26,26,.35)'},
];
function getStatus(type,id){ return localStorage.getItem('crm_s_'+type+'_'+id)||'nouveau'; }
function setStatus(type,id,s){ localStorage.setItem('crm_s_'+type+'_'+id,s); }
function getNotes(type,id){ return localStorage.getItem('crm_n_'+type+'_'+id)||''; }
function setNotes(type,id,v){ localStorage.setItem('crm_n_'+type+'_'+id,v); }

function statusSelect(type,id){
  var cur=getStatus(type,id);
  var opts=STATUS_LIST.map(function(s){
    return '<option value="'+s.id+'"'+(cur===s.id?' selected':'')+'>'+s.label+'</option>';
  }).join('');
  return '<select class="status-sel s-'+cur+'" onchange="changeStatus(\''+type+'\',\''+id+'\',this)">'+opts+'</select>';
}
function changeStatus(type,id,sel){
  setStatus(type,id,sel.value);
  sel.className='status-sel s-'+sel.value;
  refreshPipeline();
}
window.changeStatus=changeStatus;

// ── Types ────────────────────────────────────────
var TYPE_META = {
  biblio:   {label:'Bibliothèque',  plural:'Bibliothèques',  badgeClass:'tb-biblio'},
  sdb:      {label:'Salle de bain', plural:'Salles de bain', badgeClass:'tb-sdb'},
  tv:       {label:'Meuble TV',     plural:'Meubles TV',     badgeClass:'tb-tv'},
  dressing: {label:'Dressing',      plural:'Dressings',      badgeClass:'tb-dressing'},
  mobilier: {label:'Mobilier',      plural:'Mobilier',       badgeClass:'tb-mobilier'},
};

function normalizeConfig(c, source){
  var type;
  if(source==='biblio'){
    type='biblio';
  } else if(c.vasque_label && c.vasque_label.startsWith('__ft:')){
    type=c.vasque_label.slice(5); // extrait 'biblio'|'tv'|'dressing' etc.
  } else if(c.plan_l>0 && c.nb_vasques>0){
    type='sdb';
  } else {
    type='mobilier';
  }
  var dims, mat, summary, vizUrl;
  if(source==='biblio'){
    dims=c.largeur+'×'+c.hauteur+'×'+c.profondeur+' cm'; mat=c.essence||'—';
    var p=[];
    if(c.nb_etageres)     p.push(c.nb_etageres+' étagère'+(c.nb_etageres>1?'s':''));
    if(c.nb_traverses)    p.push(c.nb_traverses+' traverse'+(c.nb_traverses>1?'s':''));
    if(c.nb_intercalaires)p.push(c.nb_intercalaires+' intercalaire'+(c.nb_intercalaires>1?'s':''));
    if(c.nb_portes)       p.push(c.nb_portes+' porte'+(c.nb_portes>1?'s':''));
    summary=p.length?p.join(' · '):'Structure vide';
    try{ vizUrl='/configurateur-biblio?c='+btoa(unescape(encodeURIComponent(JSON.stringify({W:c.largeur,H:c.hauteur,D:c.profondeur,matId:c.matId||'chene',elements:c.elements||[]})))); }catch(e){ vizUrl='/configurateur-biblio'; }
  } else {
    dims=c.meuble_l+'×'+c.meuble_h+'×'+c.meuble_p+' cm'; mat=c.meuble_mat||'—';
    var p=[];
    if(c.nb_tablettes)   p.push(c.nb_tablettes+' étagère'+(c.nb_tablettes>1?'s':''));
    if(c.nb_separateurs) p.push(c.nb_separateurs+' intercalaire'+(c.nb_separateurs>1?'s':''));
    if(c.nb_portes)      p.push(c.nb_portes+' porte'+(c.nb_portes>1?'s':''));
    if(c.nb_tiroirs)     p.push(c.nb_tiroirs+' tiroir'+(c.nb_tiroirs>1?'s':''));
    if(type==='sdb')     p.push(c.nb_vasques+' vasque'+(c.nb_vasques>1?'s':''));
    summary=p.length?p.join(' · '):'Structure vide';
    var pl={ft:type,L:c.meuble_l,H:c.meuble_h,P:c.meuble_p,matLabel:c.meuble_mat,elements:Array.isArray(c.elements)?c.elements:[],plan:{L:c.plan_l,P:c.plan_p,Ep:c.plan_ep,matLabel:c.plan_mat},vasques:{nb:c.nb_vasques,W:c.vasque_w,D:c.vasque_d,label:c.vasque_label}};
    try{ vizUrl='/configurateur-test?c='+btoa(unescape(encodeURIComponent(JSON.stringify(pl)))); }catch(e){ vizUrl='/configurateur-test'; }
  }
  return {_type:type,_source:source,_raw:c,_rawId:c.id,created_at:c.created_at,prenom:c.prenom,email:c.email,message:c.message,dims:dims,mat:mat,summary:summary,vizUrl:vizUrl};
}

// ── Pipeline unifié ───────────────────────────────
function buildPipelineHTML(configs){
  var counts={};
  STATUS_LIST.forEach(function(s){counts[s.id]=0;});
  configs.forEach(function(c){ var st=getStatus(c._source,c._rawId); counts[st]=(counts[st]||0)+1; });
  var html=STATUS_LIST.map(function(s){
    return '<div class="pipe-card" id="pc-'+s.id+'" onclick="filterByStatus(\''+s.id+'\')">'
      +'<div class="pipe-dot" style="background:'+s.color+'"></div>'
      +'<div><div class="pipe-count">'+counts[s.id]+'</div><div class="pipe-lbl">'+s.label+'</div></div>'
      +'</div>';
  }).join('');
  html+='<div class="pipe-card active" id="pc-all" onclick="filterByStatus(\'\')">'
    +'<div class="pipe-dot" style="background:#aaa"></div>'
    +'<div><div class="pipe-count">'+configs.length+'</div><div class="pipe-lbl">Total</div></div>'
    +'</div>';
  return html;
}

function refreshPipeline(){
  var el=document.getElementById('pipeline');
  if(el) el.innerHTML=buildPipelineHTML(window._allConfigs||[]);
  applyFilter();
}

var _statusFilter='', _typeFilter='';
function filterByStatus(status){
  _statusFilter=status;
  document.querySelectorAll('[id^="pc-"]').forEach(function(el){el.classList.remove('active');});
  var pid=status?'pc-'+status:'pc-all';
  var pel=document.getElementById(pid); if(pel) pel.classList.add('active');
  applyFilter();
}
window.filterByStatus=filterByStatus;

function filterByType(type){
  _typeFilter=type;
  document.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('active');});
  var tid=type?'tf-'+type:'tf-all';
  var tel=document.getElementById(tid); if(tel) tel.classList.add('active');
  applyFilter();
}
window.filterByType=filterByType;

function applyFilter(){
  var s=(document.getElementById('search-all')||{value:''}).value.toLowerCase();
  (window._allConfigs||[]).forEach(function(c,idx){
    var row=document.getElementById('cfg-row-'+idx); if(!row) return;
    var matchS=!s||(c.prenom||'').toLowerCase().indexOf(s)>=0||(c.email||'').toLowerCase().indexOf(s)>=0;
    var matchF=!_statusFilter||getStatus(c._source,c._rawId)===_statusFilter;
    var matchT=!_typeFilter||c._type===_typeFilter;
    var hide=!matchS||!matchF||!matchT;
    row.classList.toggle('cfg-hidden',hide);
    var fr=document.getElementById('fiche-row-'+idx); if(fr) fr.classList.toggle('cfg-hidden',hide);
  });
}

function saveNotes(type,id,ta,hint){
  setNotes(type,id,ta.value);
  hint.textContent='✓ Notes sauvegardées';
  setTimeout(function(){hint.textContent='';},2000);
}
window.saveNotes=saveNotes;

function auth(){
  var token = document.getElementById('tokenInput').value.trim();
  if(!token){ document.getElementById('authErr').textContent='Token vide.'; return; }
  document.getElementById('authErr').textContent='';
  loadConfigs(token);
}

function loadConfigs(token){
  document.getElementById('authWrap').style.display='none';
  document.getElementById('content').style.display='block';
  var t=encodeURIComponent(token);
  Promise.all([
    fetch('/api/list-configs?token='+t).then(function(r){return r.json();}),
    fetch('/api/list-configs-sdb?token='+t).then(function(r){return r.json();})
  ]).then(function(results){
    var biblio=results[0], sdb=results[1];
    if(biblio.error){
      document.getElementById('authWrap').style.display='block';
      document.getElementById('content').style.display='none';
      document.getElementById('tokenInput').value='';
      document.getElementById('authErr').textContent='Token invalide.';
      return;
    }
    var all=[];
    (biblio.configs||[]).forEach(function(c){ all.push(normalizeConfig(c,'biblio')); });
    (sdb.configs||[]).forEach(function(c){ all.push(normalizeConfig(c,'sdb')); });
    all.sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });
    renderAll(all);
  }).catch(function(){
    document.getElementById('authWrap').style.display='block';
    document.getElementById('content').style.display='none';
    document.getElementById('authErr').textContent='Erreur réseau.';
  });
}

function fmtDate(iso){
  var d=new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})
    +' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function renderAll(configs){
  window._allConfigs=configs;
  var nb={};
  Object.keys(TYPE_META).forEach(function(k){ nb[k]=0; });

    var ficheBtn=isBiblio

      :'<button class="fiche-btn" onclick="toggleFicheSdb('+idx+')">Notes</button>';
    var pdfBtn=isBiblio
      ?'<button class="fiche-btn" onclick="generatePDF('+idx+')">PDF</button>'
      :'<button class="fiche-btn" onclick="generatePDFSdb('+idx+')">PDF</button>';
    return '<tr id="cfg-row-'+idx+'">'
      +'<td><div class="cfg-date">'+fmtDate(c.created_at)+'</div></td>'
      +'<td><div class="cfg-name">'+esc(c.prenom)+badge+'</div><div class="cfg-email">'+esc(c.email)+'</div></td>'
      +'<td><div class="cfg-dims">'+esc(c.dims)+'</div><div class="cfg-mat">'+esc(c.mat)+'</div></td>'
      +'<td><div class="cfg-elems">'+esc(c.summary)+'</div></td>'
      +'<td>'+(c.message?'<div class="cfg-msg" title="'+esc(c.message)+'">'+esc(c.message)+'</div>':'<span style="color:rgba(26,26,26,.25)">—</span>')+'</td>'
      +'<td>'+statusSelect(c._source,cid)+'</td>'
      +'<td style="white-space:nowrap"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
        +'<a href="'+c.vizUrl+'" class="viz-btn" target="_blank">▶ 3D</a>'
        +ficheBtn+pdfBtn
      +'</div></td>'
      +'</tr>'
      +'<tr id="fiche-row-'+idx+'" class="fiche-row" style="display:none">'
        +'<td colspan="7">'+(isBiblio
          ?'<div class="fiche-inner" id="fiche-inner-'+idx+'"></div>'
          :'<div style="padding:16px 20px;background:rgba(255,250,240,.5)"><div class="crm-notes-lbl">Notes internes</div>'
            +'<textarea class="crm-notes-ta" onblur="saveNotes(\''+c._source+'\',\''+cid+'\',this,document.getElementById(\'nh-'+idx+'\'))">'+esc(getNotes(c._source,cid))+'</textarea>'
            +'<div class="crm-notes-hint" id="nh-'+idx+'"></div></div>'
        )+'</td>'
      +'</tr>';
  }).join('');

  wrap.innerHTML='<table>'
    +'<thead><tr><th>Date</th><th>Contact</th><th>Dimensions</th><th>Aménagement</th><th>Message</th><th>Statut</th><th></th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>';

  var searchEl=document.getElementById('search-all');
  if(searchEl) searchEl.addEventListener('input',applyFilter);
}

function stat(val, lbl){
  return '<div class="stat"><div class="stat-val">'+val+'</div><div class="stat-lbl">'+lbl+'</div></div>';
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════
//  FICHE TECHNIQUE
// ═══════════════════════════════════════════════
var T_m  = 0.018; // épaisseur panneau 18mm
var BT_m = 0.008; // fond 8mm
var T_cm = Math.round(T_m * 100 * 10) / 10; // 1.8 cm

function toggleFiche(idx){
  var row  = document.getElementById('fiche-row-'+idx);
  var btn  = document.getElementById('fiche-btn-'+idx);
  if(!row) return;
  var isOpen = row.style.display !== 'none';
  if(isOpen){
    row.style.display = 'none';
    btn.classList.remove('open');
  } else {
    var cfg = (window._allConfigs[idx]||{})._raw;
    document.getElementById('fiche-inner-'+idx).innerHTML = buildFicheHTML(cfg, idx);
    row.style.display = '';
    btn.classList.add('open');
  }
}
window.toggleFiche = toggleFiche;

function buildFicheHTML(cfg, idx){
  var W = cfg.largeur, H = cfg.hauteur, D = cfg.profondeur;
  var iW = Math.round((W - 2*T_cm)*10)/10;
  var iH = Math.round((H - 2*T_cm)*10)/10;
  var iD = Math.round((D - BT_m*100)*10)/10;
  var maxX = iW;
  var elems = Array.isArray(cfg.elements) ? cfg.elements : [];

  var shelves = elems.filter(function(e){return e.type==='shelf'||e.type==='traverse';});
  shelves.sort(function(a,b){return a.y_cm-b.y_cm;});
  var seps = elems.filter(function(e){return e.type==='separator';});
  seps.sort(function(a,b){return a.x_cm-b.x_cm;});
  var doors = elems.filter(function(e){return e.type==='door';});

  var html = '';

  // ── Dimensions intérieures ────────────────────
  html += '<div class="fiche-sect">';
  html += '<div class="fiche-sect-title">Dimensions intérieures</div>';
  html += '<div class="fiche-block">';
  html += drow('Largeur int.', iW+' cm');
  html += drow('Hauteur int.', iH+' cm');
  html += drow('Profondeur utile', iD+' cm');
  html += drow('Épaisseur panneau', T_cm+' mm');
  html += drow('Fond', Math.round(BT_m*100*10)/10+' mm');
  html += '</div></div>';

  // ── Colonnes ──────────────────────────────────
  if(seps.length){
    html += '<div class="fiche-sect">';
    html += '<div class="fiche-sect-title">Colonnes ('+seps.length+' intercalaire'+(seps.length>1?'s':'')+')</div>';
    html += '<div class="fiche-block">';
    var xBounds = [0].concat(seps.map(function(s){return s.x_cm;})).concat([maxX]);
    xBounds.sort(function(a,b){return a-b;});
    for(var i=0;i<xBounds.length-1;i++){
      var colW = Math.round((xBounds[i+1]-xBounds[i])*10)/10;
      html += drow('Col. '+(i+1)+' ('+xBounds[i]+'→'+xBounds[i+1]+' cm)', colW+' cm');
    }
    html += '</div></div>';
  }

  // ── Étagères & traverses ──────────────────────
  if(shelves.length){
    html += '<div class="fiche-sect">';
    html += '<div class="fiche-sect-title">Étagères / traverses ('+shelves.length+')</div>';
    html += '<div class="fiche-block">';
    shelves.forEach(function(s){
      var xl = s.x_left_cm  !== undefined ? s.x_left_cm  : 0;
      var xr = s.x_right_cm !== undefined ? s.x_right_cm : maxX;
      var sw = Math.round((xr-xl)*10)/10;
      var partial = (xl!==0 || Math.abs(xr-maxX)>0.5);
      var lbl = (s.type==='traverse'?'Traverse':'Étagère')+' H='+s.y_cm+' cm';
      var val = sw+' cm'+(partial?' ('+xl+'→'+xr+')':'');
      html += drow(lbl, val);
    });
    html += '</div></div>';
  }

  // ── Cases (hauteurs libres) ───────────────────
  var fullShelves = shelves.filter(function(s){
    var xl = s.x_left_cm !== undefined ? s.x_left_cm : 0;
    var xr = s.x_right_cm !== undefined ? s.x_right_cm : maxX;
    return xl===0 && Math.abs(xr-maxX)<0.5;
  });
  html += '<div class="fiche-sect">';
  html += '<div class="fiche-sect-title">Cases (hauteurs libres)</div>';
  html += '<div class="fiche-block">';
  var yBounds = [0].concat(fullShelves.map(function(s){return s.y_cm;})).concat([H]);
  yBounds.sort(function(a,b){return a-b;});
  for(var j=0;j<yBounds.length-1;j++){
    var caseH = Math.round((yBounds[j+1]-yBounds[j]-T_cm)*10)/10;
    html += drow('Case '+(j+1)+' ('+yBounds[j]+'→'+yBounds[j+1]+' cm)', caseH+' cm');
  }
  if(shelves.length>0 && fullShelves.length===0){
    html += '<div class="fiche-empty">Étagères partielles — cases variables par colonne</div>';
  }
  html += '</div></div>';

  // ── Portes ────────────────────────────────────
  if(doors.length){
    html += '<div class="fiche-sect">';
    html += '<div class="fiche-sect-title">Portes ('+doors.length+')</div>';
    html += '<div class="fiche-block">';
    doors.forEach(function(d,i){
      var dW = Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
      var dH = Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
      html += drow('Porte '+(i+1), dW+' × '+dH+' cm');
    });
    html += '</div></div>';
  }

  // ── Surface bois (estimation) ─────────────────
  var surf = calcSurface(cfg, shelves, doors, iW, iH, iD, W, H, D);
  html += '<div class="fiche-actions">';
  html += '<div class="fiche-surface">'+surf+'</div>';
  html += '<button class="fiche-copy-btn" onclick="copyFiche(this,'+JSON.stringify(cfg).replace(/</g,'\\u003c')+')">⎘ Copier</button>';
  html += '</div>';

  // ── Notes CRM ─────────────────────────────────
  var cid = cfg.id || idx;
  var noteVal = esc(getNotes('biblio', cid));
  html += '<div class="crm-notes-wrap">';
  html += '<div class="crm-notes-lbl">Notes internes</div>';
  html += '<textarea class="crm-notes-ta" id="notes-biblio-'+cid+'" onblur="saveNotes(\'biblio\',\''+cid+'\',this,document.getElementById(\'notes-hint-biblio-'+cid+'\'))">'+noteVal+'</textarea>';
  html += '<div class="crm-notes-hint" id="notes-hint-biblio-'+cid+'"></div>';
  html += '</div>';

  return html;
}

function drow(lbl, val){
  return '<div class="fiche-drow"><span>'+esc(lbl)+'</span><strong>'+esc(val)+'</strong></div>';
}

function calcSurface(cfg, shelves, doors, iW, iH, iD, W, H, D){
  var T_cm_l = T_cm;
  // Panneaux de structure
  var s_cotes  = 2 * (H/100 * D/100);            // 2 côtés
  var s_ht     = 2 * (iW/100 * D/100);            // dessus + dessous
  var s_fond   = (iW/100) * (iH/100);             // fond
  var s_struct = s_cotes + s_ht + s_fond;

  // Étagères
  var s_etag = 0;
  shelves.forEach(function(s){
    var xl = s.x_left_cm  !== undefined ? s.x_left_cm  : 0;
    var xr = s.x_right_cm !== undefined ? s.x_right_cm : iW;
    s_etag += ((xr-xl)/100) * (iD/100);
  });

  // Portes (plein panneau)
  var s_portes = 0;
  doors.forEach(function(d){
    var dW = Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
    var dH = Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
    s_portes += (dW/100)*(dH/100);
  });

  var total = s_struct + s_etag + s_portes;

  return '<strong>Surface bois estimée :</strong> '
    + r2(s_struct)+' m² structure · '
    + (shelves.length?r2(s_etag)+' m² étagères · ':'')
    + (doors.length?r2(s_portes)+' m² portes · ':'')
    + '<strong>→ Total '+r2(total)+' m²</strong>';
}

function r2(v){ return Math.round(v*100)/100; }

function copyFiche(btn, cfg){
  var W = cfg.largeur, H = cfg.hauteur, D = cfg.profondeur;
  var iW = Math.round((W-2*T_cm)*10)/10;
  var iH = Math.round((H-2*T_cm)*10)/10;
  var iD = Math.round((D-BT_m*100)*10)/10;
  var maxX = iW;
  var elems = Array.isArray(cfg.elements)?cfg.elements:[];
  var shelves = elems.filter(function(e){return e.type==='shelf'||e.type==='traverse';});
  shelves.sort(function(a,b){return a.y_cm-b.y_cm;});
  var seps = elems.filter(function(e){return e.type==='separator';});
  seps.sort(function(a,b){return a.x_cm-b.x_cm;});
  var doors = elems.filter(function(e){return e.type==='door';});

  var lines = [
    'BIBLIOTHÈQUE '+W+'×'+H+'×'+D+' cm — '+esc(cfg.essence||''),
    'Client : '+esc(cfg.prenom)+' <'+esc(cfg.email)+'>',
    '',
    'INTÉRIEUR',
    '  Largeur int.    '+iW+' cm',
    '  Hauteur int.    '+iH+' cm',
    '  Profondeur      '+iD+' cm',
  ];
  if(seps.length){
    lines.push('');
    lines.push('COLONNES ('+seps.length+' intercalaire'+(seps.length>1?'s':'')+')');
    var xBounds = [0].concat(seps.map(function(s){return s.x_cm;})).concat([maxX]);
    xBounds.sort(function(a,b){return a-b;});
    for(var i=0;i<xBounds.length-1;i++)
      lines.push('  Col.'+(i+1)+' → '+(Math.round((xBounds[i+1]-xBounds[i])*10)/10)+' cm');
  }
  if(shelves.length){
    lines.push('');
    lines.push('ÉTAGÈRES / TRAVERSES');
    shelves.forEach(function(s){
      var xl=s.x_left_cm||0, xr=s.x_right_cm||maxX;
      lines.push('  '+(s.type==='traverse'?'Traverse':'Étagère')+' H='+s.y_cm+' cm → L='+(xr-xl)+' cm');
    });
  }
  var fullShelves = shelves.filter(function(s){
    return (s.x_left_cm||0)===0 && Math.abs((s.x_right_cm||maxX)-maxX)<0.5;
  });
  lines.push('');
  lines.push('CASES (hauteurs libres)');
  var yBounds=[0].concat(fullShelves.map(function(s){return s.y_cm;})).concat([H]);
  yBounds.sort(function(a,b){return a-b;});
  for(var j=0;j<yBounds.length-1;j++)
    lines.push('  Case '+(j+1)+' → '+(Math.round((yBounds[j+1]-yBounds[j]-T_cm)*10)/10)+' cm haut.');
  if(doors.length){
    lines.push('');
    lines.push('PORTES ('+doors.length+')');
    doors.forEach(function(d,i){
      var dW=Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
      var dH=Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
      lines.push('  Porte '+(i+1)+' → '+dW+' × '+dH+' cm');
    });
  }

  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    btn.textContent='✓ Copié !';
    btn.classList.add('ok');
    setTimeout(function(){btn.textContent='⎘ Copier';btn.classList.remove('ok');},2000);
  }).catch(function(){ window.prompt('Copier :', lines.join('\n')); });
}
window.copyFiche = copyFiche;

// ═══════════════════════════════════════════════
//  GÉNÉRATION PDF (print-to-PDF via nouvelle fenêtre)
// ═══════════════════════════════════════════════
function generatePDF(idx){
  var cfg = (window._allConfigs[idx]||{})._raw;
  if(!cfg) return;
  var html = buildPDFHtml(cfg);
  var win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(html);
  win.document.close();
  win.onload = function(){ win.focus(); win.print(); };
}
window.generatePDF = generatePDF;

function buildPDFHtml(cfg){
  var W=cfg.largeur, H=cfg.hauteur, D=cfg.profondeur;
  var iW=Math.round((W-2*T_cm)*10)/10;
  var iH=Math.round((H-2*T_cm)*10)/10;
  var iD=Math.round((D-BT_m*100)*10)/10;
  var maxX=iW;
  var elems=Array.isArray(cfg.elements)?cfg.elements:[];
  var shelves=elems.filter(function(e){return e.type==='shelf'||e.type==='traverse';});
  shelves.sort(function(a,b){return a.y_cm-b.y_cm;});
  var seps=elems.filter(function(e){return e.type==='separator';});
  seps.sort(function(a,b){return a.x_cm-b.x_cm;});
  var doors=elems.filter(function(e){return e.type==='door';});
  var fullShelves=shelves.filter(function(s){
    return (s.x_left_cm||0)===0&&Math.abs((s.x_right_cm||maxX)-maxX)<0.5;
  });

  // Surface bois
  var s_cotes=2*(H/100*D/100);
  var s_ht=2*(iW/100*D/100);
  var s_fond=(iW/100)*(iH/100);
  var s_struct=s_cotes+s_ht+s_fond;
  var s_etag=0;
  shelves.forEach(function(s){
    var xl=s.x_left_cm||0, xr=s.x_right_cm||maxX;
    s_etag+=((xr-xl)/100)*(iD/100);
  });
  var s_portes=0;
  doors.forEach(function(d){
    var dW=Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
    var dH=Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
    s_portes+=(dW/100)*(dH/100);
  });
  var s_total=s_struct+s_etag+s_portes;

  var dateStr=fmtDate(cfg.created_at);
  var ref='BIB-'+String(cfg.id||'').padStart(4,'0');

  // ── SVG coté (dessin technique avec légendes) ──
  var drawW=190, drawH=Math.round(drawW*(H/W));
  if(drawH<50)drawH=50; if(drawH>340)drawH=340;
  var mL=52, mR=52, mT=30, mB=30; // marges pour cotations
  var svgTW=mL+drawW+mR, svgTH=mT+drawH+mB;
  var px=drawW/W; // px par cm
  var t=T_cm*px;  // épaisseur panneau en px

  // Helpers cotation
  function hDim(x1,x2,y,lbl){
    var cx=(x1+x2)/2, hw=Math.max(String(lbl).length*4,8);
    return '<line x1="'+x1+'" y1="'+y+'" x2="'+(cx-hw-1)+'" y2="'+y+'" stroke="#CD3E00" stroke-width="0.7"/>'
      +'<line x1="'+(cx+hw+1)+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#CD3E00" stroke-width="0.7"/>'
      +'<line x1="'+x1+'" y1="'+(y-3.5)+'" x2="'+x1+'" y2="'+(y+3.5)+'" stroke="#CD3E00" stroke-width="0.8"/>'
      +'<line x1="'+x2+'" y1="'+(y-3.5)+'" x2="'+x2+'" y2="'+(y+3.5)+'" stroke="#CD3E00" stroke-width="0.8"/>'
      +'<rect x="'+(cx-hw-1)+'" y="'+(y-5)+'" width="'+(hw*2+2)+'" height="10" fill="#fff"/>'
      +'<text x="'+cx+'" y="'+(y+0.5)+'" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#CD3E00" font-family="Poppins,sans-serif" font-weight="700">'+lbl+'</text>';
  }
  function vDim(y1,y2,x,lbl){
    var cy=(y1+y2)/2, hw=Math.max(String(lbl).length*4,8);
    return '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+(cy-hw-1)+'" stroke="#CD3E00" stroke-width="0.7"/>'
      +'<line x1="'+x+'" y1="'+(cy+hw+1)+'" x2="'+x+'" y2="'+y2+'" stroke="#CD3E00" stroke-width="0.7"/>'
      +'<line x1="'+(x-3.5)+'" y1="'+y1+'" x2="'+(x+3.5)+'" y2="'+y1+'" stroke="#CD3E00" stroke-width="0.8"/>'
      +'<line x1="'+(x-3.5)+'" y1="'+y2+'" x2="'+(x+3.5)+'" y2="'+y2+'" stroke="#CD3E00" stroke-width="0.8"/>'
      +'<rect x="'+(x-hw-1)+'" y="'+(cy-hw-1)+'" width="'+(hw*2+2)+'" height="'+(hw*2+2)+'" fill="#fff"/>'
      +'<text x="'+x+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#CD3E00" font-family="Poppins,sans-serif" font-weight="700" transform="rotate(-90,'+x+','+cy+')">'+lbl+'</text>';
  }

  var s='';
  // ── Fond de la bibliothèque ──
  s+='<rect x="'+mL+'" y="'+mT+'" width="'+drawW+'" height="'+drawH+'" fill="#F0EDEA" stroke="#AAA" stroke-width="1.2"/>';
  s+='<rect x="'+(mL+t)+'" y="'+(mT+t)+'" width="'+(drawW-2*t)+'" height="'+(drawH-2*t)+'" fill="#FAF8F4" stroke="#CCC" stroke-width="0.5" stroke-dasharray="2,2"/>';

  // ── Étagères / traverses ──
  shelves.forEach(function(sh){
    var xl=mL+t+(sh.x_left_cm||0)*px;
    var xr=mL+t+(sh.x_right_cm||maxX)*px;
    var yy=mT+drawH-t-sh.y_cm*px;
    s+='<rect x="'+xl+'" y="'+(yy-t)+'" width="'+(xr-xl)+'" height="'+t+'" fill="#B0956E" rx="0.5"/>';
  });

  // ── Intercalaires ──
  seps.forEach(function(sp){
    var xx=mL+t+sp.x_cm*px;
    s+='<rect x="'+(xx-t/2)+'" y="'+(mT+t)+'" width="'+t+'" height="'+(drawH-2*t)+'" fill="#B0956E" rx="0.5"/>';
  });

  // ── Portes ──
  doors.forEach(function(d,di){
    var xl_=mL+t+(d.x_left_cm||0)*px;
    var xr_=mL+t+(d.x_right_cm||maxX)*px;
    var yt_=mT+drawH-t-d.ceil_y_cm*px;
    var yb_=mT+drawH-t-(d.floor_y_cm||0)*px;
    var dw_=xr_-xl_, dh_=yb_-yt_;
    s+='<rect x="'+xl_+'" y="'+yt_+'" width="'+dw_+'" height="'+dh_+'" fill="rgba(205,62,0,.09)" stroke="#CD3E00" stroke-width="1" rx="1.5"/>';
    // Poignée
    var isL=((d.x_left_cm||0)+(d.x_right_cm||maxX))/2<=maxX/2;
    s+='<circle cx="'+(isL?xr_-4:xl_+4)+'" cy="'+((yt_+yb_)/2)+'" r="2" fill="#CD3E00" opacity=".6"/>';
    // Label dimensions porte
    var dWcm=Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
    var dHcm=Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
    if(dw_>22&&dh_>14){
      s+='<rect x="'+(xl_+dw_/2-14)+'" y="'+(yt_+dh_/2-5)+'" width="28" height="10" fill="rgba(255,255,255,.9)" rx="2"/>';
      s+='<text x="'+(xl_+dw_/2)+'" y="'+(yt_+dh_/2+0.5)+'" text-anchor="middle" dominant-baseline="middle" font-size="6.5" fill="#CD3E00" font-family="Poppins,sans-serif" font-weight="700">'+dWcm+'×'+dHcm+'</text>';
    }
  });

  // ── Cotation largeur totale (bas) ──
  s+=hDim(mL, mL+drawW, mT+drawH+18, W+' cm');
  // Ligne d'attache
  s+='<line x1="'+mL+'" y1="'+(mT+drawH)+'" x2="'+mL+'" y2="'+(mT+drawH+22)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
  s+='<line x1="'+(mL+drawW)+'" y1="'+(mT+drawH)+'" x2="'+(mL+drawW)+'" y2="'+(mT+drawH+22)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';

  // ── Cotation hauteur totale (droite) ──
  s+=vDim(mT, mT+drawH, mL+drawW+20, H+' cm');
  s+='<line x1="'+(mL+drawW)+'" y1="'+mT+'" x2="'+(mL+drawW+24)+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
  s+='<line x1="'+(mL+drawW)+'" y1="'+(mT+drawH)+'" x2="'+(mL+drawW+24)+'" y2="'+(mT+drawH)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';

  // ── Cotations largeurs colonnes (haut) ──
  var xBoundsS=[0].concat(seps.map(function(sp){return sp.x_cm;})).concat([maxX]);
  xBoundsS.sort(function(a,b){return a-b;});
  if(seps.length>0){
    for(var ci=0;ci<xBoundsS.length-1;ci++){
      var cxl=mL+t+xBoundsS[ci]*px;
      var cxr=mL+t+xBoundsS[ci+1]*px;
      if(cxr-cxl>16){
        var cW=Math.round((xBoundsS[ci+1]-xBoundsS[ci])*10)/10;
        s+=hDim(cxl,cxr,mT-16,cW+' cm');
        s+='<line x1="'+cxl+'" y1="'+(mT-12)+'" x2="'+cxl+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
        s+='<line x1="'+cxr+'" y1="'+(mT-12)+'" x2="'+cxr+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
      }
    }
  } else {
    // Largeur intérieure
    s+=hDim(mL+t,mL+drawW-t,mT-16,iW+' cm int.');
  }

  // ── Cotations hauteurs cases (gauche) ──
  var yBoundsS=[0].concat(fullShelves.map(function(sh){return sh.y_cm;})).concat([H]);
  yBoundsS.sort(function(a,b){return a-b;});
  for(var ki=0;ki<yBoundsS.length-1;ki++){
    var cy1=mT+drawH-t-yBoundsS[ki+1]*px;
    var cy2=mT+drawH-t-yBoundsS[ki]*px;
    if(ki>0)cy1+=t; // dessous de l'étagère
    var cH=Math.round((yBoundsS[ki+1]-yBoundsS[ki]-T_cm)*10)/10;
    if(cy2-cy1>12){
      s+=vDim(cy1,cy2,mL-18,cH+' cm');
      s+='<line x1="'+(mL-14)+'" y1="'+cy1+'" x2="'+mL+'" y2="'+cy1+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
      s+='<line x1="'+(mL-14)+'" y1="'+cy2+'" x2="'+mL+'" y2="'+cy2+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
    }
  }

  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+svgTW+' '+svgTH+'" width="'+svgTW+'" height="'+svgTH+'">'+s+'</svg>';

  // Tables HTML pour chaque section
  function tbl(rows){
    return '<table><tbody>'+rows.map(function(r){
      return '<tr><td class="lbl">'+r[0]+'</td><td class="val">'+r[1]+'</td></tr>';
    }).join('')+'</tbody></table>';
  }

  var colRows=[];
  if(seps.length){
    var xBounds=[0].concat(seps.map(function(s){return s.x_cm;})).concat([maxX]);
    xBounds.sort(function(a,b){return a-b;});
    for(var i=0;i<xBounds.length-1;i++){
      var colW=Math.round((xBounds[i+1]-xBounds[i])*10)/10;
      colRows.push(['Colonne '+(i+1)+' ('+xBounds[i]+' → '+xBounds[i+1]+' cm)', '<strong>'+colW+' cm</strong>']);
    }
  }

  var shelfRows=shelves.map(function(s,i){
    var xl=s.x_left_cm||0, xr=s.x_right_cm||maxX;
    var sw=Math.round((xr-xl)*10)/10;
    var partial=(xl!==0||Math.abs(xr-maxX)>0.5);
    return [(s.type==='traverse'?'Traverse':'Étagère')+' n°'+(i+1)+' — H = '+s.y_cm+' cm',
      '<strong>Larg. '+sw+' cm</strong>'+(partial?' <span class="note">partielle ('+xl+' → '+xr+' cm)</span>':'')];
  });

  var yBounds=[0].concat(fullShelves.map(function(s){return s.y_cm;})).concat([H]);
  yBounds.sort(function(a,b){return a-b;});
  var caseRows=yBounds.slice(0,-1).map(function(y,i){
    var cH=Math.round((yBounds[i+1]-y-T_cm)*10)/10;
    return ['Case '+(i+1)+' (de '+y+' cm à '+yBounds[i+1]+' cm)', '<strong>'+cH+' cm</strong> haut. libre'];
  });

  var doorRows=doors.map(function(d,i){
    var dW=Math.round(((d.x_right_cm-d.x_left_cm)-0.3)*10)/10;
    var dH=Math.round(((d.ceil_y_cm-d.floor_y_cm)-0.4)*10)/10;
    return ['Porte n°'+(i+1)+' — baie '+d.x_left_cm+' → '+d.x_right_cm+' cm', '<strong>'+dW+' × '+dH+' cm</strong>'];
  });

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/>'
    +'<title>Fiche '+ref+' — '+esc(cfg.prenom)+'</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:Poppins,sans-serif;color:#1A1A1A;background:#fff;padding:32px 40px;font-size:12px}'
    +'@page{size:A4;margin:16mm 14mm}'
    +'@media print{body{padding:0}}'
    +'.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #CD3E00;padding-bottom:16px;margin-bottom:24px}'
    +'.brand{font-size:22px;font-weight:900;letter-spacing:-.03em;color:#1A1A1A}'
    +'.brand em{font-style:italic;font-weight:300;color:rgba(26,26,26,.3)}'
    +'.ref-block{text-align:right}'
    +'.ref{font-size:18px;font-weight:700;color:#CD3E00}'
    +'.ref-date{font-size:10px;color:rgba(26,26,26,.4);margin-top:2px}'
    +'.meta{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;margin-bottom:24px;align-items:start}'
    +'.meta-block{background:#F8F5F0;border-radius:8px;padding:12px 16px}'
    +'.meta-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,26,26,.4);margin-bottom:8px}'
    +'.meta-val{font-size:14px;font-weight:700}'
    +'.meta-sub{font-size:11px;color:rgba(26,26,26,.5)}'
    +'.dims-big{display:flex;gap:8px;align-items:baseline}'
    +'.dims-big span{font-size:22px;font-weight:900;color:#CD3E00}'
    +'.dims-big small{font-size:11px;color:rgba(26,26,26,.4)}'
    +'.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}'
    +'.sect{margin-bottom:16px}'
    +'.sect-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#CD3E00;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(205,62,0,.2)}'
    +'table{width:100%;border-collapse:collapse}'
    +'tr:nth-child(even) td{background:#FAFAF8}'
    +'td{padding:5px 8px;font-size:11px;vertical-align:top}'
    +'td.lbl{color:rgba(26,26,26,.55);width:60%}'
    +'td.val{font-weight:600;text-align:right}'
    +'.note{font-size:9px;font-weight:400;color:rgba(26,26,26,.45)}'
    +'.surface-box{background:#F8F5F0;border-radius:8px;padding:14px 16px;margin-bottom:16px}'
    +'.surface-box .s-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,26,26,.4);margin-bottom:10px}'
    +'.surface-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}'
    +'.sval{font-size:14px;font-weight:900;color:#CD3E00}'
    +'.slbl{font-size:9px;color:rgba(26,26,26,.45);margin-top:1px}'
    +'.footer{border-top:1px solid rgba(26,26,26,.1);padding-top:12px;display:flex;justify-content:space-between;font-size:9px;color:rgba(26,26,26,.35)}'
    +'.print-btn{position:fixed;bottom:24px;right:24px;padding:12px 24px;background:#CD3E00;color:#fff;border:none;border-radius:100px;font-family:Poppins,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(205,62,0,.3)}'
    +'@media print{.print-btn{display:none}}'
    +'</style></head><body>'
    // Header
    +'<div class="header">'
      +'<div class="brand">Kobo <em>Design</em></div>'
      +'<div class="ref-block"><div class="ref">'+ref+'</div><div class="ref-date">'+dateStr+'</div></div>'
    +'</div>'
    // Meta
    +'<div class="meta">'
      +'<div class="meta-block"><div class="meta-title">Client</div><div class="meta-val">'+esc(cfg.prenom)+'</div><div class="meta-sub">'+esc(cfg.email)+'</div></div>'
      +'<div class="meta-block"><div class="meta-title">Bibliothèque</div>'
        +'<div class="dims-big"><span>'+W+'×'+H+'×'+D+'</span><small>cm</small></div>'
        +'<div class="meta-sub" style="margin-top:4px">'+esc(cfg.essence||'—')+'</div>'
      +'</div>'
      +'<div>'+svg+'</div>'
    +'</div>'
    // Grille principale
    +'<div class="body-grid">'
    // Col gauche
    +'<div>'
    +'<div class="sect"><div class="sect-title">Dimensions intérieures</div>'
    +tbl([
      ['Largeur intérieure','<strong>'+iW+' cm</strong>'],
      ['Hauteur intérieure','<strong>'+iH+' cm</strong>'],
      ['Profondeur utile','<strong>'+iD+' cm</strong>'],
      ['Épaisseur panneau','<strong>'+T_cm+' mm</strong>'],
      ['Fond','<strong>'+Math.round(BT_m*100*10)/10+' mm</strong>'],
    ])+'</div>'
    +(seps.length?'<div class="sect"><div class="sect-title">Colonnes ('+seps.length+' intercalaire'+(seps.length>1?'s':'')+')</div>'+tbl(colRows)+'</div>':'')
    +'</div>'
    // Col droite
    +'<div>'
    +(shelves.length?'<div class="sect"><div class="sect-title">Étagères / Traverses ('+shelves.length+')</div>'+tbl(shelfRows)+'</div>':'')
    +'<div class="sect"><div class="sect-title">Cases (hauteurs libres)</div>'+tbl(caseRows)+'</div>'
    +(doors.length?'<div class="sect"><div class="sect-title">Portes ('+doors.length+')</div>'+tbl(doorRows)+'</div>':'')
    +'</div>'
    +'</div>'
    // Surface bois
    +'<div class="surface-box"><div class="s-title">Surface bois estimée</div>'
    +'<div class="surface-grid">'
    +'<div><div class="sval">'+r2(s_struct)+'</div><div class="slbl">m² structure</div></div>'
    +(shelves.length?'<div><div class="sval">'+r2(s_etag)+'</div><div class="slbl">m² étagères</div></div>':'')
    +(doors.length?'<div><div class="sval">'+r2(s_portes)+'</div><div class="slbl">m² portes</div></div>':'')
    +'<div><div class="sval" style="color:#1A1A1A">'+r2(s_total)+'</div><div class="slbl">m² total</div></div>'
    +'</div></div>'
    // Message client
    +(cfg.message?'<div class="sect"><div class="sect-title">Message client</div><div style="background:#F8F5F0;border-radius:8px;padding:10px 14px;font-size:11px;font-style:italic;color:rgba(26,26,26,.6)">'+esc(cfg.message)+'</div></div>':'')
    // Footer
    +'<div class="footer"><span>Kobo Design — document interne</span><span>'+ref+' · '+dateStr+'</span></div>'
    // Bouton impression
    +'<button class="print-btn" onclick="window.print()">🖨️ Imprimer / PDF</button>'
    +'</body></html>';
}


function toggleFicheSdb(idx){
  var row = document.getElementById('fiche-row-'+idx);
  if(!row) return;
  row.style.display = row.style.display==='none' ? '' : 'none';
}
window.toggleFicheSdb = toggleFicheSdb;

function generatePDFSdb(idx){
  var cfg = (window._allConfigs[idx]||{})._raw;
  if(!cfg) return;
  var html = buildPDFHtmlSdb(cfg);
  var win = window.open('', '_blank', 'width=1000,height=800');
  win.document.write(html);
  win.document.close();
  win.onload = function(){ win.focus(); win.print(); };
}

function parseKeyS(key){
  var p=String(key||'').split('_');
  if(p.length<4) return null;
  return {bot:parseFloat(p[0]),xleft:parseFloat(p[1]),top:parseFloat(p[2]),xright:parseFloat(p[3])};
}

function buildPDFHtmlSdb(cfg){
  var W=cfg.meuble_l||0, H=cfg.meuble_h||0, P=cfg.meuble_p||0;
  var ep=1.8;
  var elems=Array.isArray(cfg.elements)?cfg.elements:[];
  var shelves=elems.filter(function(e){return e.type==='shelf';}).sort(function(a,b){return a.y_cm-b.y_cm;});
  var seps=elems.filter(function(e){return e.type==='separator';}).sort(function(a,b){return a.x_cm-b.x_cm;});
  var portes=elems.filter(function(e){return e.type==='porte';});
  var tiroirs=elems.filter(function(e){return e.type==='tiroir';});
  var iW=W-2*ep, iH=H-2*ep;
  var ref='SDB-'+String(cfg.id||'').padStart(4,'0');
  var dateStr=fmtDate(cfg.created_at);

  function buildSVG(withTiroirs){
    var drawW=200, drawH=Math.round(drawW*(H/W));
    if(drawH<60)drawH=60; if(drawH>320)drawH=320;
    var mL=52,mR=50,mT=30,mB=28;
    var svgTW=mL+drawW+mR, svgTH=mT+drawH+mB;
    var px=drawW/W, t=ep*px;
    function hDim(x1,x2,y,lbl){
      var cx=(x1+x2)/2,hw=Math.max(String(lbl).length*4,8);
      return '<line x1="'+x1+'" y1="'+y+'" x2="'+(cx-hw-1)+'" y2="'+y+'" stroke="#CD3E00" stroke-width="0.7"/>'
        +'<line x1="'+(cx+hw+1)+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#CD3E00" stroke-width="0.7"/>'
        +'<line x1="'+x1+'" y1="'+(y-3.5)+'" x2="'+x1+'" y2="'+(y+3.5)+'" stroke="#CD3E00" stroke-width="0.8"/>'
        +'<line x1="'+x2+'" y1="'+(y-3.5)+'" x2="'+x2+'" y2="'+(y+3.5)+'" stroke="#CD3E00" stroke-width="0.8"/>'
        +'<rect x="'+(cx-hw-1)+'" y="'+(y-5)+'" width="'+(hw*2+2)+'" height="10" fill="#fff"/>'
        +'<text x="'+cx+'" y="'+(y+0.5)+'" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#CD3E00" font-family="Poppins,sans-serif" font-weight="700">'+lbl+'</text>';
    }
    function vDim(y1,y2,x,lbl){
      var cy=(y1+y2)/2,hw=Math.max(String(lbl).length*4,8);
      return '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+(cy-hw-1)+'" stroke="#CD3E00" stroke-width="0.7"/>'
        +'<line x1="'+x+'" y1="'+(cy+hw+1)+'" x2="'+x+'" y2="'+y2+'" stroke="#CD3E00" stroke-width="0.7"/>'
        +'<line x1="'+(x-3.5)+'" y1="'+y1+'" x2="'+(x+3.5)+'" y2="'+y1+'" stroke="#CD3E00" stroke-width="0.8"/>'
        +'<line x1="'+(x-3.5)+'" y1="'+y2+'" x2="'+(x+3.5)+'" y2="'+y2+'" stroke="#CD3E00" stroke-width="0.8"/>'
        +'<rect x="'+(x-hw-1)+'" y="'+(cy-hw-1)+'" width="'+(hw*2+2)+'" height="'+(hw*2+2)+'" fill="#fff"/>'
        +'<text x="'+x+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#CD3E00" font-family="Poppins,sans-serif" font-weight="700" transform="rotate(-90,'+x+','+cy+')">'+lbl+'</text>';
    }
    function yPx(y_cm){return mT+drawH-t-y_cm*px;}
    function xPx(x_cm){return mL+t+x_cm*px;}
    var s='';
    s+='<rect x="'+mL+'" y="'+mT+'" width="'+drawW+'" height="'+drawH+'" fill="#E8E2D8" stroke="#999" stroke-width="1.2"/>';
    s+='<rect x="'+(mL+t)+'" y="'+(mT+t)+'" width="'+(drawW-2*t)+'" height="'+(drawH-2*t)+'" fill="#FAF8F4" stroke="#CCC" stroke-width="0.5" stroke-dasharray="2,2"/>';
    shelves.forEach(function(sh){
      var xl=xPx(sh.x_left_cm||0),xr=xPx(sh.x_right_cm||iW),yy=yPx(sh.y_cm);
      s+='<rect x="'+xl+'" y="'+(yy-t)+'" width="'+(xr-xl)+'" height="'+t+'" fill="#B0956E" rx="0.5"/>';
    });
    seps.forEach(function(sp){
      var xx=xPx(sp.x_cm);
      s+='<rect x="'+(xx-t/2)+'" y="'+(mT+t)+'" width="'+t+'" height="'+(drawH-2*t)+'" fill="#B0956E" rx="0.5"/>';
    });
    portes.forEach(function(p){
      var k=parseKeyS(p.key); if(!k) return;
      var xl=xPx(k.xleft),xr=xPx(k.xright),yt=yPx(k.top),yb=yPx(k.bot),dw=xr-xl,dh=yb-yt;
      s+='<rect x="'+xl+'" y="'+yt+'" width="'+dw+'" height="'+dh+'" fill="rgba(205,62,0,.1)" stroke="#CD3E00" stroke-width="1" rx="1.5"/>';
      var isL=(k.xleft+k.xright)/2<=iW/2;
      s+='<circle cx="'+(isL?xr-4:xl+4)+'" cy="'+((yt+yb)/2)+'" r="2" fill="#CD3E00" opacity=".6"/>';
    });
    tiroirs.forEach(function(p){
      var k=parseKeyS(p.key); if(!k) return;
      var xl=xPx(k.xleft),xr=xPx(k.xright),yt=yPx(k.top),yb=yPx(k.bot),dw=xr-xl,dh=yb-yt;
      if(withTiroirs){
        s+='<rect x="'+xl+'" y="'+yt+'" width="'+dw+'" height="'+dh+'" fill="#C8B89A" stroke="#8B7355" stroke-width="1" rx="1"/>';
        s+='<line x1="'+(xl+4)+'" y1="'+((yt+yb)/2)+'" x2="'+(xr-4)+'" y2="'+((yt+yb)/2)+'" stroke="#8B7355" stroke-width="0.5" opacity=".5"/>';
      } else {
        s+='<rect x="'+xl+'" y="'+yt+'" width="'+dw+'" height="'+dh+'" fill="rgba(26,26,26,.03)" stroke="rgba(26,26,26,.2)" stroke-width="0.8" stroke-dasharray="3,2" rx="1"/>';
      }
      if(dw>20&&dh>12){
        var wlbl=Math.round(k.xright-k.xleft)+' cm';
        s+='<rect x="'+(xl+dw/2-10)+'" y="'+(yt+dh/2-5)+'" width="20" height="10" fill="rgba(255,255,255,.85)" rx="2"/>';
        s+='<text x="'+(xl+dw/2)+'" y="'+(yt+dh/2+0.5)+'" text-anchor="middle" dominant-baseline="middle" font-size="6" fill="'+(withTiroirs?'#6B5535':'rgba(26,26,26,.4)')+'" font-family="Poppins,sans-serif" font-weight="700">'+wlbl+'</text>';
      }
    });
    s+=hDim(mL,mL+drawW,mT+drawH+18,W+' cm');
    s+='<line x1="'+mL+'" y1="'+(mT+drawH)+'" x2="'+mL+'" y2="'+(mT+drawH+22)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
    s+='<line x1="'+(mL+drawW)+'" y1="'+(mT+drawH)+'" x2="'+(mL+drawW)+'" y2="'+(mT+drawH+22)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
    s+=vDim(mT,mT+drawH,mL+drawW+18,H+' cm');
    s+='<line x1="'+(mL+drawW)+'" y1="'+mT+'" x2="'+(mL+drawW+22)+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
    s+='<line x1="'+(mL+drawW)+'" y1="'+(mT+drawH)+'" x2="'+(mL+drawW+22)+'" y2="'+(mT+drawH)+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';
    var xB=[0].concat(seps.map(function(sp){return sp.x_cm;})).concat([iW]).sort(function(a,b){return a-b;});
    if(seps.length){
      for(var ci=0;ci<xB.length-1;ci++){
        var cxl=xPx(xB[ci]),cxr=xPx(xB[ci+1]);
        if(cxr-cxl>16){s+=hDim(cxl,cxr,mT-16,Math.round(xB[ci+1]-xB[ci])+' cm');s+='<line x1="'+cxl+'" y1="'+(mT-12)+'" x2="'+cxl+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/><line x1="'+cxr+'" y1="'+(mT-12)+'" x2="'+cxr+'" y2="'+mT+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';}
      }
    } else { s+=hDim(mL+t,mL+drawW-t,mT-16,Math.round(iW)+' cm int.'); }
    var fsh=shelves.filter(function(sh){return (sh.x_left_cm||0)<1&&(sh.x_right_cm||iW)>iW-1;});
    var yB=[0].concat(fsh.map(function(sh){return sh.y_cm;})).concat([iH]).sort(function(a,b){return a-b;});
    for(var ki=0;ki<yB.length-1;ki++){
      var cy1=yPx(yB[ki+1]),cy2=yPx(yB[ki]);
      if(ki>0)cy1+=t;
      var cH=Math.round((yB[ki+1]-yB[ki]-ep)*10)/10;
      if(cy2-cy1>12){s+=vDim(cy1,cy2,mL-18,cH+' cm');s+='<line x1="'+(mL-14)+'" y1="'+cy1+'" x2="'+mL+'" y2="'+cy1+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/><line x1="'+(mL-14)+'" y1="'+cy2+'" x2="'+mL+'" y2="'+cy2+'" stroke="#CD3E00" stroke-width="0.5" stroke-dasharray="2,2"/>';}
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+svgTW+' '+svgTH+'" width="100%" style="max-width:'+(svgTW*1.4)+'px">'+s+'</svg>';
  }

  var svgAvec=buildSVG(true), svgSans=buildSVG(false);
  function tbl(rows){return '<table><tbody>'+rows.map(function(r){return '<tr><td class="lbl">'+r[0]+'</td><td class="val">'+r[1]+'</td></tr>';}).join('')+'</tbody></table>';}
  var r2=function(n){return Math.round(n*100)/100;};
  var s_struct=2*(H/100*P/100)+2*(iW/100*P/100)+(iW/100)*(iH/100);
  var s_etag=0; shelves.forEach(function(sh){var xl=sh.x_left_cm||0,xr=sh.x_right_cm||iW;s_etag+=((xr-xl)/100)*(P/100*0.9);});
  var s_fac=0; portes.concat(tiroirs).forEach(function(p){var k=parseKeyS(p.key);if(k)s_fac+=((k.xright-k.xleft)/100)*((k.top-k.bot)/100);});

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><title>Fiche '+ref+' — '+esc(cfg.prenom)+'</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;color:#1A1A1A;background:#fff;padding:32px 40px;font-size:12px}'
    +'@page{size:A4;margin:14mm 12mm}@media print{body{padding:0}.print-btn{display:none!important}}'
    +'.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #CD3E00;padding-bottom:14px;margin-bottom:20px}'
    +'.brand{font-size:20px;font-weight:900;letter-spacing:-.03em}.brand em{font-style:italic;font-weight:300;color:rgba(26,26,26,.3)}'
    +'.ref{font-size:16px;font-weight:700;color:#CD3E00}.ref-date{font-size:10px;color:rgba(26,26,26,.4);margin-top:2px;text-align:right}'
    +'.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}'
    +'.meta-block{background:#F8F5F0;border-radius:8px;padding:10px 14px}'
    +'.meta-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,26,26,.4);margin-bottom:6px}'
    +'.meta-val{font-size:13px;font-weight:700}.meta-sub{font-size:10px;color:rgba(26,26,26,.5);margin-top:2px}'
    +'.schemas{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px}'
    +'.schema-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(205,62,0,.2)}'
    +'.schema-avec{color:#6B5535}.schema-sans{color:rgba(26,26,26,.4)}'
    +'.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}'
    +'.sect{margin-bottom:14px}.sect-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#CD3E00;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid rgba(205,62,0,.2)}'
    +'table{width:100%;border-collapse:collapse}tr:nth-child(even) td{background:#FAFAF8}'
    +'td{padding:4px 8px;font-size:10px;vertical-align:top}td.lbl{color:rgba(26,26,26,.55);width:55%}td.val{font-weight:600;text-align:right}'
    +'.surface-box{background:#F8F5F0;border-radius:8px;padding:12px 16px;margin-bottom:14px}'
    +'.s-title{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,26,26,.4);margin-bottom:8px}'
    +'.surface-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}'
    +'.sval{font-size:13px;font-weight:900;color:#CD3E00}.slbl{font-size:9px;color:rgba(26,26,26,.45);margin-top:1px}'
    +'.footer{border-top:1px solid rgba(26,26,26,.1);padding-top:10px;display:flex;justify-content:space-between;font-size:9px;color:rgba(26,26,26,.35)}'
    +'.print-btn{position:fixed;bottom:24px;right:24px;padding:12px 24px;background:#CD3E00;color:#fff;border:none;border-radius:100px;font-family:Poppins,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(205,62,0,.3)}'
    +'</style></head><body>'
    +'<div class="header"><div class="brand">Kobo <em>Design</em> — Salle de Bain</div><div><div class="ref">'+ref+'</div><div class="ref-date">'+dateStr+'</div></div></div>'
    +'<div class="meta">'
      +'<div class="meta-block"><div class="meta-title">Client</div><div class="meta-val">'+esc(cfg.prenom)+'</div><div class="meta-sub">'+esc(cfg.email)+'</div></div>'
      +'<div class="meta-block"><div class="meta-title">Meuble</div><div class="meta-val">'+W+'×'+H+'×'+P+' cm</div><div class="meta-sub">'+esc(cfg.meuble_mat)+'</div></div>'
      +'<div class="meta-block"><div class="meta-title">Plan de travail</div><div class="meta-val">'+cfg.plan_l+'×'+cfg.plan_p+' cm</div><div class="meta-sub">'+esc(cfg.plan_mat)+'</div></div>'
    +'</div>'
    +'<div class="schemas">'
      +'<div><div class="schema-title schema-avec">Vue de face — avec tiroirs</div>'+svgAvec+'</div>'
      +'<div><div class="schema-title schema-sans">Vue de face — sans tiroirs</div>'+svgSans+'</div>'
    +'</div>'
    +'<div class="body-grid"><div>'
      +'<div class="sect"><div class="sect-title">Dimensions intérieures</div>'+tbl([['Largeur int.',Math.round(iW)+' cm'],['Hauteur int.',Math.round(iH)+' cm'],['Profondeur',P+' cm'],['Épaisseur panneau',ep+' mm']])+'</div>'
      +(seps.length?'<div class="sect"><div class="sect-title">Séparateurs</div>'+tbl(seps.map(function(s,i){return ['Séparateur n°'+(i+1),'X = '+s.x_cm+' cm'];}))+'</div>':'')
      +'<div class="sect"><div class="sect-title">Vasque'+(cfg.nb_vasques>1?'s':'')+'</div>'+tbl([['Modèle',(cfg.vasque_label||'—')],['Nombre',cfg.nb_vasques],['Dimensions',cfg.vasque_w+'×'+cfg.vasque_d+' cm']])+'</div>'
    +'</div><div>'
      +(shelves.length?'<div class="sect"><div class="sect-title">Tablettes ('+shelves.length+')</div>'+tbl(shelves.map(function(s,i){var xl=s.x_left_cm||0,xr=s.x_right_cm||iW,partial=xl>1||(xr<iW-1);return ['Tablette n°'+(i+1)+' H='+s.y_cm+' cm','<strong>'+(xr-xl)+' cm</strong>'+(partial?' (partielle)':'')];}))+'</div>':'')
      +(portes.length?'<div class="sect"><div class="sect-title">Portes ('+portes.length+')</div>'+tbl(portes.map(function(p,i){var k=parseKeyS(p.key);if(!k)return['Porte n°'+(i+1),'—'];return['Porte n°'+(i+1),'<strong>'+Math.round(k.xright-k.xleft)+'×'+Math.round(k.top-k.bot)+' cm</strong>'];}))+'</div>':'')
      +(tiroirs.length?'<div class="sect"><div class="sect-title">Tiroirs ('+tiroirs.length+')</div>'+tbl(tiroirs.map(function(p,i){var k=parseKeyS(p.key);if(!k)return['Tiroir n°'+(i+1),'—'];return['Tiroir n°'+(i+1),'<strong>'+Math.round(k.xright-k.xleft)+'×'+Math.round(k.top-k.bot)+' cm</strong>'];}))+'</div>':'')
    +'</div></div>'
    +'<div class="surface-box"><div class="s-title">Surface bois estimée</div><div class="surface-grid">'
      +'<div><div class="sval">'+r2(s_struct)+'</div><div class="slbl">m² structure</div></div>'
      +(shelves.length?'<div><div class="sval">'+r2(s_etag)+'</div><div class="slbl">m² tablettes</div></div>':'')
      +(s_fac>0?'<div><div class="sval">'+r2(s_fac)+'</div><div class="slbl">m² façades</div></div>':'')
      +'<div><div class="sval" style="color:#1A1A1A">'+r2(s_struct+s_etag+s_fac)+'</div><div class="slbl">m² total</div></div>'
    +'</div></div>'
    +(cfg.message?'<div class="sect"><div class="sect-title">Message client</div><div style="background:#F8F5F0;border-radius:8px;padding:8px 12px;font-size:11px;font-style:italic;color:rgba(26,26,26,.6)">'+esc(cfg.message)+'</div></div>':'')
    +'<div class="footer"><span>Kobo Design — document interne</span><span>'+ref+' · '+dateStr+'</span></div>'
    +'<button class="print-btn" onclick="window.print()">🖨️ Imprimer / PDF</button>'
    +'</body></html>';
}

// Auto-login si token dans l'URL
var urlToken = new URLSearchParams(location.search).get('t');
if(urlToken){ document.getElementById('tokenInput').value=urlToken; auth(); }
</script>
